# ============================================================================
# grip-mcp — the quality table (Milestone 0)
#
# Single source of truth, serving simultaneously as:
#   * spec appendix              (DESIGN.md §13; grammar decisions in
#                                 docs/appendix/APPENDIX.md)
#   * meta-test input            (tests/test_table_meta.py)
#   * reference-script input     (tools/reference/refengine.py)
#   * implementation table       (the V1 engine, post-freeze)
#
# Row ids equal the name-grammar suffix each row produces, with one
# exception: `maj` produces the empty suffix ("C" is C major).
#
# Columns per row (all mandatory — enforced by the meta-test):
#   name      suffix production ("" for maj)
#   tones     chord-tone set: pitch-class intervals from the root, sorted,
#             always containing 0
#   degrees   spelling rule: strict interval stacking from the (re)spelled
#             root; token = optional accidental (b/bb/#/##) + degree digit.
#             Degree 9 spells as a second (letter-wise) — the add-nine.
#             Empty iff spell = "canonical".
#   spell     "stack"     = member spelling by degree stacking (§5.2.2)
#             "canonical" = canonical root table applied per PC (coll only)
#   tier      R3 tier (see [tiers]; lower ranks earlier)
#   order     the quality-order tie-break column: global, unique, ascending =
#             earlier. Exercised directly by the B5 fixture (Bsus2 vs Bsus4).
#   inversion "member-index" = candidate `inversion` is the bass member's
#             index in `degrees` (0 = root position); "none" = null (§7.4:
#             dyads, q4, coll)
#   discount  R2.2 discounted set (intervals whose absence is not counted).
#             Default policy is {7} — the perfect fifth above the root; dim
#             and aug rows discount nothing (altered fifths are defining;
#             DESIGN §7.2), and rows without a P5 discount nothing.
#   family    the family column (chosen tier-3 resolution; DESIGN §5.1)
#   gen       "table" = general generation (12 roots x row, exact PC cover)
#             "dyad"  = special-case: one candidate rooted at the bass, only
#                       for 2-distinct-PC inputs, token by PC distance;
#                       distance 7 produces no dyad (the `5` row covers it)
#             "coll"  = totality catch-all: generated iff nothing else covers;
#                       tones are the input's PC set, root at bass
# ============================================================================

[table]
schema_version = 1
table_version = "0.1.0"        # -> "1.0.0" at the Milestone-0 freeze

[roots]
# Canonical context-free root table, index = pitch class (flat-side, with the
# single sharp exception F#; DESIGN §5.2.1 / decision ledger).
canonical = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"]

[tiers]
# R3, best-first: dyad/5 < triads < sevenths < add/sus/sixth < q4 < coll.
1 = "dyads and the bare fifth"
2 = "triads"
3 = "sevenths"
4 = "add/sus/sixth"
5 = "quartal"
6 = "collection catch-all"

[grammar]
# The accepted `chosen` suffix set is (quality names) UNION (family names);
# both are case-sensitive. Full grammar: docs/appendix/APPENDIX.md.
accidentals = ["b", "#", "bb", "##"]
families = ["dy", "5", "maj", "m", "dim", "aug", "sus", "7", "add", "q4", "coll"]
# Dyad token set (fixed; DESIGN §5.2.4). Encoding decision (open question 2):
# name = "dy" + token, case-sensitive. See APPENDIX.md.
dyad_tokens = ["m2", "M2", "m3", "M3", "P4", "A4", "m6", "M6", "m7", "M7"]

