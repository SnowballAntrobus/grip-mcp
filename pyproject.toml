[project]
name = "grip-mcp"
version = "0.1.0.dev0"
description = "MCP server: a deterministic fretboard engine — identify, library, render — with the conversation as the control surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dante Gil-Marin", email = "drgilmarin@icloud.com" }]
# Milestone 0 is dependency-free (tomllib is stdlib on >=3.11).
# The `mcp` SDK, resvg bindings, etc. arrive with V1 per docs/DESIGN.md §4.
dependencies = []

[project.optional-dependencies]
# Test oracle and Phase-3 spikes only; promoted to core in Phase 3 (DESIGN §4).
m21 = ["music21"]

[project.scripts]
grip-mcp = "grip_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grip_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
